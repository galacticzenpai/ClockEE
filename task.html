<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task & DPP Hub // ClockEE OS 2.0</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface-0: #090d16;
      --surface-1: #111726;
      --surface-2: #1a2236;
      --surface-inset: #060910;
      --border-subtle: 1px solid rgba(255, 255, 255, 0.08);
      --border-strong: 1px solid rgba(255, 255, 255, 0.16);
      --border-focus: 2px solid #38bdf8;
    }
    body {
      background-color: var(--surface-0);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .tabular { font-variant-numeric: tabular-nums; }
    .panel {
      background-color: var(--surface-1);
      border: var(--border-subtle);
    }
    .panel-inset {
      background-color: var(--surface-inset);
      border: var(--border-subtle);
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .kanban-card {
      background-color: var(--surface-inset);
      border: var(--border-subtle);
      transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
    }
    .kanban-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .kanban-card.selected-card {
      border-color: #38bdf8 !important;
      background-color: rgba(56, 189, 248, 0.08) !important;
      transform: translateY(-2px);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-0); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body data-page="task" class="min-h-screen flex flex-col bg-[#090d16] text-[#f8fafc]">

  <!-- Unified Navigation Bar Component -->
  <div id="clockee-nav" class="tabular-nums"></div>

  <main class="max-w-7xl mx-auto px-4 py-6 md:py-8 flex-1 w-full space-y-6">

    <!-- Header Strip -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-amber-400"></span>
          <span class="text-xs font-bold tracking-widest text-amber-400 uppercase mono">KANBAN TASK & DPP EXECUTION HUB</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight mt-1">Daily Target Execution Board</h1>
        <p class="text-sm text-slate-400 mt-1">Vim Keyboard Controls (H/J/K/L) &bull; Subject Metadata &bull; Offline-First</p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openAddTaskModal()" class="touch-target px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-xs font-bold text-white transition shadow-sm mono uppercase">
          + Add New DPP / Task
        </button>
      </div>
    </div>

    <!-- 4-Column Kanban Board -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-start">
      
      <!-- Column 1: Backlog -->
      <div class="panel p-4 rounded-2xl space-y-3 min-h-[480px] flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mono">Backlog</h2>
          </div>
          <span id="count-backlog" class="text-xs text-slate-400 mono tabular">0</span>
        </div>
        <div id="col-backlog" class="space-y-2.5 flex-1 overflow-y-auto">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Column 2: Today's Target -->
      <div class="panel p-4 rounded-2xl space-y-3 min-h-[480px] flex flex-col border-sky-500/30">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-sky-400 mono">Today's Target</h2>
          </div>
          <span id="count-today" class="text-xs text-sky-400 font-bold mono tabular">0</span>
        </div>
        <div id="col-today" class="space-y-2.5 flex-1 overflow-y-auto">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Column 3: In Solving -->
      <div class="panel p-4 rounded-2xl space-y-3 min-h-[480px] flex flex-col border-amber-500/30">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mono">In Solving</h2>
          </div>
          <span id="count-solving" class="text-xs text-amber-400 font-bold mono tabular">0</span>
        </div>
        <div id="col-solving" class="space-y-2.5 flex-1 overflow-y-auto">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Column 4: Mastered -->
      <div class="panel p-4 rounded-2xl space-y-3 min-h-[480px] flex flex-col border-emerald-500/30">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mono">Mastered</h2>
          </div>
          <span id="count-mastered" class="text-xs text-emerald-400 font-bold mono tabular">0</span>
        </div>
        <div id="col-mastered" class="space-y-2.5 flex-1 overflow-y-auto">
          <!-- Populated dynamically -->
        </div>
      </div>

    </div>

    <!-- Vim Keyboard Legend -->
    <div class="panel p-3.5 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-3">
        <span class="font-bold text-slate-300 mono uppercase">Vim Controls:</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200 mono">J</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200 mono">K</kbd> Select Card</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200 mono">H</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200 mono">L</kbd> Move Column</span>
      </div>
      <div class="text-[11px] text-slate-400 mono">
        IndexedDB Store: <strong class="text-cyan-400">clockee_db.tasks</strong>
      </div>
    </div>

  </main>

  <!-- Add Task Modal -->
  <div id="add-task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="bg-[#111726] border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Create New Task / DPP</h3>
        <button onclick="closeAddTaskModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mono mb-1">Task Title</label>
          <input type="text" id="task-title-input" placeholder="e.g. Irodov Problems 1.15 to 1.30" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mono mb-1">Subject</label>
            <select id="task-subject-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-semibold">
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Mathematics">Mathematics</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mono mb-1">Est. Minutes</label>
            <input type="number" id="task-est-input" value="45" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white mono tabular">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mono mb-1">Source / Tags</label>
          <input type="text" id="task-source-input" placeholder="e.g. Allen Module / PYQ 2024 / MS Chouhan" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
        <button onclick="closeAddTaskModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">Cancel</button>
        <button onclick="submitNewTask()" class="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs uppercase mono transition shadow-sm">Save Task</button>
      </div>
    </div>
  </div>

  <script src="scripts/db.js"></script>
  <script src="components/navbar.js"></script>
  <script>
    const COLUMNS = ['backlog', 'today', 'solving', 'mastered'];

    let tasks = [
      { id: 't1', title: 'Irodov: Rotational Dynamics Problem Set 1', subject: 'Physics', priority: 'P1', status: 'today', estMinutes: 60, source: 'Irodov Ex 1.25' },
      { id: 't2', title: 'MS Chouhan: Carbonyl Compounds Reaction Drill', subject: 'Chemistry', priority: 'P2', status: 'today', estMinutes: 45, source: 'MS Chouhan GOC' },
      { id: 't3', title: 'Definite Integrals King\'s Rule 25 Problems', subject: 'Mathematics', priority: 'P1', status: 'solving', estMinutes: 50, source: 'Allen Ex 2' },
      { id: 't4', title: 'Thermodynamics Carnot Cycle PYQ 2021-2024', subject: 'Physics', priority: 'P3', status: 'backlog', estMinutes: 40, source: 'PYQ Book' },
      { id: 't5', title: 'Ionic Equilibrium Solubility Product Sheet', subject: 'Chemistry', priority: 'P2', status: 'mastered', estMinutes: 30, source: 'Resonance DPP' }
    ];

    let selectedTaskId = 't1';

    window.addEventListener('DOMContentLoaded', async () => {
      await loadTasksFromDB();
      renderBoard();

      // Vim Keyboard Navigation: H, J, K, L
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;

        if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown') {
          navigateCardSelection(1);
        } else if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp') {
          navigateCardSelection(-1);
        } else if (e.key === 'l' || e.key === 'L' || e.key === 'ArrowRight') {
          moveSelectedTask(1);
        } else if (e.key === 'h' || e.key === 'H' || e.key === 'ArrowLeft') {
          moveSelectedTask(-1);
        }
      });
    });

    async function loadTasksFromDB() {
      if (window.ClockEEDB) {
        try {
          const stored = await ClockEEDB.getAll('tasks');
          if (stored && stored.length > 0) {
            tasks = stored.map(s => ({
              id: s.taskId || s.id,
              title: s.title,
              subject: s.subject,
              priority: s.priority || 'P2',
              status: s.status || 'today',
              estMinutes: s.estimatedMinutes || 45,
              source: s.source || 'General'
            }));
          }
        } catch (e) {
          console.warn('Could not load tasks from DB:', e);
        }
      }
    }

    function renderBoard() {
      COLUMNS.forEach(col => {
        const container = document.getElementById(`col-${col}`);
        const colTasks = tasks.filter(t => t.status === col);
        document.getElementById(`count-${col}`).innerText = colTasks.length;

        container.innerHTML = colTasks.map(t => {
          const isSelected = t.id === selectedTaskId;

          let badgeColor = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
          if (t.subject === 'Chemistry') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
          else if (t.subject === 'Mathematics') badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';

          return `
            <div onclick="selectCard('${t.id}')" class="kanban-card p-3.5 rounded-xl border space-y-2 ${isSelected ? 'selected-card' : ''}">
              <div class="flex items-center justify-between text-[10px] mono">
                <span class="px-2 py-0.5 rounded font-bold border uppercase ${badgeColor}">${t.subject}</span>
                <span class="text-slate-400 tabular">${t.estMinutes}m</span>
              </div>
              <div class="text-xs font-semibold text-white leading-snug">${escapeHtml(t.title)}</div>
              <div class="flex items-center justify-between text-[10px] text-slate-400 mono border-t border-slate-800/80 pt-1.5">
                <span class="truncate max-w-[130px]">${escapeHtml(t.source)}</span>
                <span class="text-purple-400 font-bold">${t.priority}</span>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function selectCard(id) {
      selectedTaskId = id;
      renderBoard();
    }

    function navigateCardSelection(dir) {
      const allIds = tasks.map(t => t.id);
      const currIdx = allIds.indexOf(selectedTaskId);
      const nextIdx = Math.max(0, Math.min(allIds.length - 1, currIdx + dir));
      selectedTaskId = allIds[nextIdx];
      renderBoard();
    }

    function moveSelectedTask(dir) {
      const task = tasks.find(t => t.id === selectedTaskId);
      if (!task) return;
      const currColIdx = COLUMNS.indexOf(task.status);
      const nextColIdx = Math.max(0, Math.min(COLUMNS.length - 1, currColIdx + dir));
      task.status = COLUMNS[nextColIdx];
      saveTasks();
      renderBoard();
    }

    async function saveTasks() {
      if (window.ClockEEDB) {
        for (const t of tasks) {
          await ClockEEDB.put('tasks', {
            taskId: t.id,
            title: t.title,
            subject: t.subject,
            priority: t.priority,
            status: t.status,
            estimatedMinutes: t.estMinutes,
            source: t.source,
            createdAt: new Date().toISOString()
          });
        }
      }
    }

    function openAddTaskModal() {
      document.getElementById('add-task-modal').classList.remove('hidden');
    }

    function closeAddTaskModal() {
      document.getElementById('add-task-modal').classList.add('hidden');
    }

    async function submitNewTask() {
      const title = document.getElementById('task-title-input').value.trim();
      if (!title) return;
      const subject = document.getElementById('task-subject-input').value;
      const est = parseInt(document.getElementById('task-est-input').value) || 45;
      const source = document.getElementById('task-source-input').value.trim() || 'Coaching DPP';

      const newTask = {
        id: `task_${Date.now()}`,
        title,
        subject,
        priority: 'P1',
        status: 'today',
        estMinutes: est,
        source
      };

      tasks.push(newTask);
      selectedTaskId = newTask.id;
      await saveTasks();
      closeAddTaskModal();
      renderBoard();
      document.getElementById('task-title-input').value = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
