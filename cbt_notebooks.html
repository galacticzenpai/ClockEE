<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Security & Content Protection Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob: data:; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; font-src 'self' https: data:;" />
  <script src="env.js" onerror="/* env.js optional */"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClockEE CBT - 3-Way Notebooks Repository</title>
  <link rel="stylesheet" href="cbt_shared.css">
  <style>
    .cbt-notebooks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .cbt-notebook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .cbt-nb-card {
      background: var(--cbt-bg-surface);
      border: 1px solid var(--cbt-border-subtle);
      border-radius: var(--cbt-radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cbt-nb-card:hover {
      border-color: var(--cbt-accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }

    .cbt-nb-card-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .cbt-nb-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--cbt-text-secondary);
      border-top: 1px solid var(--cbt-border-subtle);
      padding-top: 12px;
      margin-top: 16px;
    }

    /* Modal */
    .cbt-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cbt-modal-backdrop.active {
      display: flex;
    }

    .cbt-nb-modal {
      background: var(--cbt-bg-surface);
      border: 1px solid var(--cbt-border-medium);
      border-radius: var(--cbt-radius-lg);
      width: 100%;
      max-width: 520px;
      padding: 24px;
    }

    .cbt-input-field {
      width: 100%;
      background: var(--cbt-bg-elevated);
      border: 1px solid var(--cbt-border-subtle);
      border-radius: var(--cbt-radius-md);
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .cbt-input-field:focus {
      border-color: var(--cbt-accent);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- Shared Left Sidebar -->
    <!-- Cockpit Suite Universal Top Navigation Bar -->
  <header class="glass sticky top-0 z-50 border-b border-white/10 px-4 md:px-8 py-3.5 transition-colors duration-300 backdrop-blur-md bg-[#050811]/80">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2 group text-decoration-none">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-black text-black text-base shadow-[0_0_15px_rgba(0,240,255,0.4)] group-hover:scale-105 transition-transform">
            EE
          </div>
          <span class="font-bold text-lg md:text-xl tracking-wider text-white">Clock<span class="text-cyan-400">EE</span></span>
        </a>
      </div>

      <!-- Center Desktop Navigation Links -->
      <nav id="main-nav" class="hidden md:flex items-center gap-1 bg-white/5 border border-white/10 p-1 rounded-full backdrop-blur-md">
        <a href="index.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Timer</a>
        <a href="today.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Today</a>
        <a href="study.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Syllabus</a>
        <a href="cbt_home.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-cyan-400 text-black shadow-[0_0_12px_rgba(0,240,255,0.5)] font-bold transition">CBT Portal</a>
        <a href="notes.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Formula</a>
        <a href="calendar.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Calendar</a>
        <a href="inspiration.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition">Inspiration</a>
      </nav>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-2">
        <a href="split_screen.html" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-cyan-400 transition border border-white/5" title="Split Screen Multi-App">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
        </a>
        <a href="profile.html" class="flex items-center gap-2 p-1.5 pr-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition group">
          <div class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-xs border border-cyan-500/30">
            A
          </div>
          <span class="text-xs font-medium text-slate-300 group-hover:text-white hidden sm:inline">Aspirant</span>
        </a>
        <!-- Mobile Drawer Hamburger Toggle Button -->
        <button id="clockee-mobile-hamburger-btn" class="md:hidden p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-cyan-400 transition border border-white/5" aria-label="Toggle Navigation Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="cbt-sidebar-container"></div>

  <!-- Main Viewport Area -->
  <main class="cbt-main-content">
    
    <header class="cbt-notebooks-header">
      <div>
        <h1 class="cbt-title-lg">Notebooks Repository</h1>
        <p class="cbt-subtext">3-Way structured repository for high-yield bookmarks, formula traps, and test autopsies</p>
      </div>

      <button class="cbt-btn cbt-btn-primary" onclick="openCreateModal()">
        + Create New Notebook
      </button>
    </header>

    <!-- 3-Way Tabs Switcher -->
    <div style="margin-bottom: 24px;">
      <div class="cbt-tabs-pill">
        <button class="cbt-tab-btn active" onclick="switchNotebookView('my')">My Custom Notebooks</button>
        <button class="cbt-tab-btn" onclick="switchNotebookView('chapter')">Chapter-wise Notebooks</button>
        <button class="cbt-tab-btn" onclick="switchNotebookView('test')">Test-wise Repositories</button>
      </div>
    </div>

    <!-- Notebooks Grid -->
    <div class="cbt-notebook-grid" id="notebooks-container">
      <!-- Rendered via JavaScript -->
    </div>

  </main>

  <!-- Create Notebook Modal -->
  <div class="cbt-modal-backdrop" id="modal-create-nb">
    <div class="cbt-nb-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 class="cbt-title-md">Create New Notebook</h3>
        <button onclick="closeCreateModal()" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">✕</button>
      </div>

      <label style="font-size: 12px; font-weight: 700; color: var(--cbt-text-secondary); text-transform: uppercase;">Notebook Title</label>
      <input type="text" id="nb-title-input" class="cbt-input-field" placeholder="e.g. Inorganic Exceptions & Reagents">

      <label style="font-size: 12px; font-weight: 700; color: var(--cbt-text-secondary); text-transform: uppercase;">Subject Focus</label>
      <select id="nb-subject-input" class="cbt-input-field">
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Maths">Maths</option>
        <option value="Full">Full Syllabus / General</option>
      </select>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
        <button class="cbt-btn cbt-btn-outline" onclick="closeCreateModal()">Cancel</button>
        <button class="cbt-btn cbt-btn-primary" onclick="submitCreateNotebook()">Save Notebook</button>
      </div>
    </div>
  </div>

  <script src="cbt_shared.js"></script>
  <script>
    let activeView = "my";

    document.addEventListener("DOMContentLoaded", () => {
      CBT_STATE.renderSidebar("notebooks");
      renderNotebooks();
    });

    function switchNotebookView(view) {
      activeView = view;
      document.querySelectorAll('.cbt-tab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick')?.includes(`'${view}'`));
      });
      renderNotebooks();
    }

    function renderNotebooks() {
      const container = document.getElementById("notebooks-container");
      const state = CBT_STATE.load();
      const nbs = state.notebooks || [];

      container.innerHTML = nbs.map(nb => {
        const subBadgeClass = nb.subject === "Physics" ? "cbt-tag-physics" : nb.subject === "Chemistry" ? "cbt-tag-chemistry" : nb.subject === "Maths" ? "cbt-tag-maths" : "cbt-tag-physics";

        return `
          <div class="cbt-nb-card" onclick="openNotebookDetail('${nb.id}')">
            <div>
              <span class="cbt-tag ${subBadgeClass}" style="margin-bottom: 12px;">${nb.subject}</span>
              <h3 class="cbt-nb-card-title">${nb.title}</h3>
              <p class="cbt-subtext" style="font-size: 13px;">Contains verified questions and high-yield autopsies.</p>
            </div>

            <div class="cbt-nb-stats-row">
              <span>🔖 <strong>${nb.count}</strong> Items</span>
              <span>Updated ${nb.updated}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCreateModal() {
      document.getElementById("modal-create-nb").classList.add("active");
    }

    function closeCreateModal() {
      document.getElementById("modal-create-nb").classList.remove("active");
    }

    function submitCreateNotebook() {
      const title = document.getElementById("nb-title-input").value.trim();
      const subject = document.getElementById("nb-subject-input").value;

      if (!title) {
        CBT_STATE.toast("Please enter a notebook title", "error");
        return;
      }

      const state = CBT_STATE.load();
      state.notebooks = state.notebooks || [];
      state.notebooks.push({
        id: `nb_${Date.now()}`,
        title: title,
        subject: subject,
        count: 0,
        updated: "Just now"
      });

      CBT_STATE.save(state);
      closeCreateModal();
      renderNotebooks();
      CBT_STATE.toast(`Created notebook: ${title}`);
    }

    function openNotebookDetail(id) {
      CBT_STATE.toast(`Opened notebook: #${id}`);
    }
  </script>
<script src="clockee_core.js"></script>
</body>
</html>
