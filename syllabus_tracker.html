<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClockEE - JEE / NEET Syllabus Knowledge DAG</title>
  <link rel="stylesheet" href="cbt_shared.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #07090e; color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="p-6 max-w-6xl mx-auto">
  <header class="border-b border-white/10 pb-5 mb-8 flex justify-between items-center">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="text-xl font-bold font-mono text-emerald-400">Curriculum Prerequisite Knowledge DAG</h1>
      </div>
      <p class="text-xs text-slate-400">Unlock advanced physics, chemistry, and calculus modules as foundational mastery is proven.</p>
    </div>
    <a href="cbt_exam.html" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-black font-semibold text-xs font-mono rounded-lg transition">BACK TO EXAM</a>
  </header>

  <div id="dag-container"></div>

  <script src="js/dag_renderer.js"></script>
  <script>
    fetch('integrations/syllabus/syllabus_dag.json')
      .then(res => res.json())
      .then(data => {
        const renderer = new SyllabusDAGRenderer('#dag-container', data);
        renderer.render();
      })
      .catch(err => console.error('Failed to load DAG:', err));
  </script>
</body>
</html>
