<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClockEE - Student &amp; Commander Access Portal</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfi0nZUbOZhMr4Igvo4KRQGHVPRwLMO4k",
      authDomain: "clockee-app.firebaseapp.com",
      databaseURL: "https://clockee-app-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "clockee-app",
      storageBucket: "clockee-app.firebasestorage.app",
      messagingSenderId: "66153109265",
      appId: "1:66153109265:web:dde95257b9b1ae0c6c9eb0",
      measurementId: "G-BFSXRW308R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.FB_APP = app;
    window.FB_AUTH = auth;
    window.FB_DB = db;
    window.FB_OPS = { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, ref, set, get, child };
  </script>

  <style>
    :root {
      --bg-base: #07080d;
      --bg-surface: #0f121d;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
    }

    body {
      background-color: var(--bg-base);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-panel {
      background: rgba(13, 17, 30, 0.78);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border-radius: 24px;
    }

    /* Ambient Dynamic Aura Background */
    .dynamic-aura-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aura-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.35;
      animation: floatAura 10s infinite ease-in-out alternate;
    }
    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -80px;
      left: 15%;
    }
    .blob-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #00f0ff 0%, transparent 70%);
      bottom: -60px;
      right: 15%;
      animation-delay: -4s;
    }
    @keyframes floatAura {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    /* Cyber-Bear Whimsical Mascot Styles */
    .mascot-box {
      width: 170px;
      height: 145px;
      margin: 0 auto -20px auto;
      position: relative;
      z-index: 20;
    }
    svg.bear-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .bear-arm {
      transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center bottom;
    }
    .bear-pupil {
      transition: transform 0.08s ease-out;
    }

    /* Mascot Action States */
    .covering-eyes .left-arm {
      transform: translateY(-78px) rotate(14deg);
    }
    .covering-eyes .right-arm {
      transform: translateY(-78px) rotate(-14deg);
    }
    .peeking .left-arm {
      transform: translateY(-60px) translateX(-10px) rotate(28deg);
    }
    .peeking .right-arm {
      transform: translateY(-78px) rotate(-14deg);
    }
    .head-tilt {
      animation: tiltHead 1.2s infinite ease-in-out alternate;
    }
    @keyframes tiltHead {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* Form Input Controls */
    .form-input {
      width: 100%;
      background: rgba(7, 10, 19, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.84rem;
      color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
      background: rgba(11, 15, 28, 0.95);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="p-4 sm:p-6 relative">

  <!-- Background Animated Nebula Aura -->
  <div class="dynamic-aura-bg">
    <div class="aura-blob blob-1"></div>
    <div class="aura-blob blob-2"></div>
  </div>

  <div class="w-full max-w-md relative z-10 space-y-4">

    <!-- Top Brand & Mascot Container -->
    <div class="text-center space-y-1">
      <!-- Whimsical Interactive Mascot: Astro-Bear -->
      <div class="mascot-box" id="mascotWrapper">
        <svg class="bear-svg" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <linearGradient id="bearBody" x1="0" y1="0" x2="200" y2="180" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1e2238"/>
              <stop offset="1" stop-color="#0f111d"/>
            </linearGradient>
            <linearGradient id="earCyan" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#38bdf8"/>
            </linearGradient>
          </defs>

          <!-- Head Group (can tilt on loading) -->
          <g id="bearHeadGroup">
            <!-- Ears -->
            <circle cx="45" cy="50" r="23" fill="url(#bearBody)" stroke="#6366f1" stroke-width="2.5"/>
            <circle cx="45" cy="50" r="12" fill="url(#earCyan)" opacity="0.6"/>
            <circle cx="155" cy="50" r="23" fill="url(#bearBody)" stroke="#6366f1" stroke-width="2.5"/>
            <circle cx="155" cy="50" r="12" fill="url(#earCyan)" opacity="0.6"/>

            <!-- Head Frame -->
            <rect x="30" y="40" width="140" height="118" rx="58" fill="url(#bearBody)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
            
            <!-- Soft Cheeks -->
            <ellipse cx="56" cy="116" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>
            <ellipse cx="144" cy="116" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>

            <!-- Snout -->
            <ellipse cx="100" cy="114" rx="25" ry="18" fill="#151928" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
            <!-- Cute Nose -->
            <path d="M94 107C94 107 97 113 100 113C103 113 106 107 106 107H94Z" fill="#38bdf8"/>
            <path d="M100 113V120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
            <path d="M93 120C95 123 100 124 100 120C100 124 105 123 107 120" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

            <!-- Eyes & Interactive Tracking Pupils -->
            <!-- Left Eye Socket -->
            <ellipse cx="70" cy="90" rx="14" ry="16" fill="#080a14" stroke="#6366f1" stroke-width="2"/>
            <!-- Left Pupil -->
            <g id="pupilLeft" class="bear-pupil">
              <circle cx="70" cy="90" r="7" fill="#00f0ff" filter="url(#eyeGlow)"/>
              <circle cx="68" cy="88" r="2.2" fill="#ffffff"/>
            </g>

            <!-- Right Eye Socket -->
            <ellipse cx="130" cy="90" rx="14" ry="16" fill="#080a14" stroke="#6366f1" stroke-width="2"/>
            <!-- Right Pupil -->
            <g id="pupilRight" class="bear-pupil">
              <circle cx="130" cy="90" r="7" fill="#00f0ff" filter="url(#eyeGlow)"/>
              <circle cx="128" cy="88" r="2.2" fill="#ffffff"/>
            </g>
          </g>

          <!-- Robotic Arms (Slide up and cover eyes) -->
          <!-- Left Arm -->
          <g id="armLeft" class="bear-arm left-arm" style="transform-origin: 40px 175px;">
            <path d="M30 175C30 152 46 142 66 152C80 159 82 175 82 175H30Z" fill="#171a2c" stroke="#6366f1" stroke-width="2.5"/>
            <circle cx="56" cy="158" r="7.5" fill="#38bdf8" opacity="0.6"/>
            <circle cx="44" cy="152" r="2.8" fill="#6366f1"/>
            <circle cx="56" cy="147" r="2.8" fill="#6366f1"/>
            <circle cx="68" cy="152" r="2.8" fill="#6366f1"/>
          </g>

          <!-- Right Arm -->
          <g id="armRight" class="bear-arm right-arm" style="transform-origin: 160px 175px;">
            <path d="M170 175C170 152 154 142 134 152C120 159 118 175 118 175H170Z" fill="#171a2c" stroke="#6366f1" stroke-width="2.5"/>
            <circle cx="144" cy="158" r="7.5" fill="#38bdf8" opacity="0.6"/>
            <circle cx="156" cy="152" r="2.8" fill="#6366f1"/>
            <circle cx="144" cy="147" r="2.8" fill="#6366f1"/>
            <circle cx="132" cy="152" r="2.8" fill="#6366f1"/>
          </g>
        </svg>
      </div>

      <div class="flex items-center justify-center gap-2">
        <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
          <span>ClockEE</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-950/80 border border-indigo-500/30 text-indigo-300 font-bold">Cloud Sync</span>
        </h1>
      </div>
      <p class="text-xs text-gray-400">JEE 2028 Study Engine &amp; CBT Portal Access</p>
    </div>

    <!-- Main Glassmorphic Card -->
    <div class="glass-panel p-6 sm:p-7 space-y-5">

      <!-- Tab Switcher: Sign In vs Create Account -->
      <div class="flex p-1 bg-black/40 border border-white/10 rounded-xl gap-1">
        <button id="tabBtnSignIn" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-xs font-bold rounded-lg text-white bg-indigo-600 transition shadow">
          Sign In
        </button>
        <button id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition">
          Create Account
        </button>
      </div>

      <!-- Feedback / Alert Banner (Hidden by default) -->
      <div id="authAlert" class="hidden p-3 rounded-xl border text-xs font-medium flex items-center gap-2"></div>

      <!-- FORM: SIGN IN -->
      <form id="formSignIn" onsubmit="handleSignIn(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
          <input 
            type="email" 
            id="signInEmail" 
            required 
            placeholder="kunalsahoo4015@gmail.com" 
            class="form-input tracking-input" 
            autocomplete="email"
          />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-[11px] font-bold uppercase tracking-wider text-gray-300">Password</label>
            <button type="button" onclick="togglePasswordVisibility('signInPassword', this)" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium">
              Show
            </button>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="signInPassword" 
              required 
              placeholder="••••••••••••" 
              class="form-input password-input pr-10" 
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">

        <button type="submit" id="btnSubmitSignIn" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-extrabold text-sm transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
          <span>Authorize &amp; Launch ClockEE</span> →
        </button>
      </form>

      <!-- FORM: CREATE ACCOUNT (Hidden by default) -->
      <form id="formSignUp" onsubmit="handleSignUp(event)" class="space-y-3.5 hidden">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Student Full Name</label>
          <input 
            type="text" 
            id="signUpName" 
            required 
            placeholder="e.g. Kunal Sahoo" 
            class="form-input tracking-input"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
          <input 
            type="email" 
            id="signUpEmail" 
            required 
            placeholder="student@example.com" 
            class="form-input tracking-input" 
            autocomplete="email"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Aspirant Role &amp; Target Year</label>
          <select id="signUpRole" class="form-input bg-gray-900">
            <option value="JEE 2028 Aspirant">JEE 2028 Aspirant (Class 11 / Foundation)</option>
            <option value="JEE 2027 Aspirant">JEE 2027 Aspirant (Class 12 / Sprint)</option>
            <option value="Mentor / Faculty">Mentor / Faculty / Parent Supervisor</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-[11px] font-bold uppercase tracking-wider text-gray-300">Set Secure Password</label>
            <button type="button" onclick="togglePasswordVisibility('signUpPassword', this)" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium">
              Show
            </button>
          </div>
          <input 
            type="password" 
            id="signUpPassword" 
            required 
            minlength="6" 
            placeholder="At least 6 characters" 
            class="form-input password-input" 
            autocomplete="new-password"
          />

        <button type="submit" id="btnSubmitSignUp" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm transition shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2">

    </div>

    <!-- Active Cloud Status Pill -->
    <div class="flex items-center justify-center gap-2 text-[11px] font-mono text-gray-400">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Firebase Cloud Database: `clockee-app` Online</span>
    </div>

  </div>

  <script>
    // ─── 1. Whimsical Mascot Logic (Eyes Tracking & Paws Covering) ───
    const mascot = document.getElementById('mascotWrapper');
    const pupilLeft = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');

    // Eye Tracking while typing in any tracking input
    document.querySelectorAll('.tracking-input').forEach(input => {
      input.addEventListener('input', (e) => {
        const len = Math.min(e.target.value.length, 30);
        // Map 0-30 characters to -5px to +5px translation
        const offsetX = (len / 30) * 10 - 5;
        const offsetY = 3; // looking slightly down at form

        pupilLeft.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        pupilRight.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      });

      input.addEventListener('blur', () => {
        pupilLeft.style.transform = 'translate(0px, 0px)';
        pupilRight.style.transform = 'translate(0px, 0px)';
      });
    });

    // Paws cover eyes when focusing on any password input
    document.querySelectorAll('.password-input').forEach(pwdInput => {
      pwdInput.addEventListener('focus', () => {
        mascot.classList.add('covering-eyes');
      });

      pwdInput.addEventListener('blur', () => {
        mascot.classList.remove('covering-eyes', 'peeking');
      });
    });

    // Toggle Password Visibility & Mascot Peek-a-boo
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Hide';
        mascot.classList.add('peeking');
      } else {
        input.type = 'password';
        btn.innerText = 'Show';
        mascot.classList.remove('peeking');
      }
    };

    // Tab Switcher between Sign In and Sign Up
    window.switchAuthTab = function(tab) {
      const signInForm = document.getElementById('formSignIn');
      const signUpForm = document.getElementById('formSignUp');
      const btnIn = document.getElementById('tabBtnSignIn');
      const btnUp = document.getElementById('tabBtnSignUp');
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.add('hidden');

      if (tab === 'signin') {
        signInForm.classList.remove('hidden');
        signUpForm.classList.add('hidden');
        btnIn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-white bg-indigo-600 transition shadow';
        btnUp.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition';
      } else {
        signInForm.classList.add('hidden');
        signUpForm.classList.remove('hidden');
        btnUp.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-white bg-emerald-600 transition shadow';
        btnIn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition';
      }
    };

    function showAlert(msg, isError = true) {
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.remove('hidden', 'bg-red-950/60', 'border-red-500/30', 'text-red-300', 'bg-emerald-950/60', 'border-emerald-500/30', 'text-emerald-300');
      if (isError) {
        alertBox.classList.add('bg-red-950/60', 'border-red-500/30', 'text-red-300');
        alertBox.innerHTML = `<span>⚠️</span> <span>${msg}</span>`;
      } else {
        alertBox.classList.add('bg-emerald-950/60', 'border-emerald-500/30', 'text-emerald-300');
        alertBox.innerHTML = `<span>✓</span> <span>${msg}</span>`;
      }
    }

    // ─── 2. Real Cloud Authentication & Cross-Device Sync ───
    window.handleSignIn = async function(e) {
      e.preventDefault();
      const email = document.getElementById('signInEmail').value.trim();
      const password = document.getElementById('signInPassword').value;
      const btn = document.getElementById('btnSubmitSignIn');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin">⏳</span> Authenticating...`;

      try {
        let userRecord = null;

        // Try Firebase Authentication
        if (window.FB_AUTH && window.FB_OPS?.signInWithEmailAndPassword) {
          try {
            const cred = await window.FB_OPS.signInWithEmailAndPassword(window.FB_AUTH, email, password);
            userRecord = {
              uid: cred.user.uid,
              email: cred.user.email,
              name: cred.user.displayName || email.split('@')[0],
              role: "JEE 2028 Aspirant"
            };
          } catch (fbErr) {
            console.warn("Firebase sign-in failed, trying fallback...", fbErr);
            throw fbErr;
          }
        }

        // Store active authenticated session
        finalizeUserLogin(userRecord || { uid: "user_" + btoa(email).slice(0, 10), email, name: email.split('@')[0], role: "JEE 2028 Aspirant" });
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Authorize &amp; Launch ClockEE</span> →`;
        showAlert(err.message.replace('Firebase: ', '').replace('(auth/', '').replace(').', ''));
      }
    };

    window.handleSignUp = async function(e) {
      e.preventDefault();
      const name = document.getElementById('signUpName').value.trim();
      const email = document.getElementById('signUpEmail').value.trim();
      const role = document.getElementById('signUpRole').value;
      const password = document.getElementById('signUpPassword').value;
      const btn = document.getElementById('btnSubmitSignUp');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin">⏳</span> Provisioning Account...`;

      try {
        let userRecord = null;

        // Try Firebase Registration
        if (window.FB_AUTH && window.FB_OPS?.createUserWithEmailAndPassword) {
          const cred = await window.FB_OPS.createUserWithEmailAndPassword(window.FB_AUTH, email, password);
          userRecord = {
            uid: cred.user.uid,
            email: cred.user.email,
            name: name,
            role: role
          };

          // Save Student Record in Firebase Database
          if (window.FB_DB && window.FB_OPS?.set && window.FB_OPS?.ref) {
            await window.FB_OPS.set(window.FB_OPS.ref(window.FB_DB, `students/${cred.user.uid}/profile`), {
              name,
              email,
              role,
              createdAt: new Date().toISOString()
            });
          }
        }

        finalizeUserLogin(userRecord || { uid: "user_" + btoa(email).slice(0, 10), email, name, role });
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Create Cloud Profile</span> ✓`;
        showAlert(err.message.replace('Firebase: ', '').replace('(auth/', '').replace(').', ''));
      }
    };

    function finalizeUserLogin(user) {
      showAlert(`Welcome back, ${user.name}! Syncing cloud vault...`, false);

      // 1. Save active user identity
      localStorage.setItem('clockee_current_user', JSON.stringify(user));
      
      // 2. Register into multi-user list
      try {
        let list = JSON.parse(localStorage.getItem('clockee_multi_users') || '[]');
        list.forEach(u => u.active = false);
        const existingIdx = list.findIndex(u => u.id === user.uid || u.email === user.email);
        const profileObj = {
          id: user.uid,
          name: user.name,
          email: user.email,
          subtitle: `${user.role} • Cloud Account`,
          role: user.role,
          pfp: `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${encodeURIComponent(user.name)}`,
          active: true,
          lastLogin: new Date().toISOString()
        };
        if (existingIdx !== -1) {
          list[existingIdx] = profileObj;
        } else {
          list.unshift(profileObj);
        }
        localStorage.setItem('clockee_multi_users', JSON.stringify(list));
      } catch (e) {}

      // 3. Hydrate APP_STATE
      try {
        const core = JSON.parse(localStorage.getItem('clockee_v5_master_state') || '{}');
        core.profile = { ...(core.profile || {}), name: user.name, subtitle: `${user.role} • Cloud Account` };
        localStorage.setItem('clockee_v5_master_state', JSON.stringify(core));
      } catch(e) {}

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 700);
    }

    window.handleForgotPassword = function() {
      const email = document.getElementById('signInEmail').value.trim();
      if (!email) {
        showAlert("Enter your email address first to reset password.");
        return;
      }
      showAlert(`Password reset instructions dispatched to ${email}`, false);
    };
  </script>
</body>
</html>
